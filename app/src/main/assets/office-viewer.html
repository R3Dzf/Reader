<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #eceef2; }
    #document { position: absolute; inset: 0; }
    #message { box-sizing: border-box; min-height: 100%; padding: 28px 20px; display: grid; place-content: center;
      text-align: center; white-space: pre-line; color: #30343b; font: 16px/1.6 sans-serif; }
    #message[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="document"></div>
  <div id="message">جارٍ فتح المستند…</div>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const format = params.get('format');
    const token = params.get('token');
    const isArabic = (navigator.language || '').toLowerCase().startsWith('ar');
    document.documentElement.lang = isArabic ? 'ar' : 'en';
    document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
    const container = document.getElementById('document');
    const message = document.getElementById('message');
    const documentUrl = `${location.origin}/document/${encodeURIComponent(token)}/file`;
    message.textContent = isArabic ? 'جارٍ فتح المستند…' : 'Opening document…';

    function showError(error) {
      message.hidden = false;
      const heading = isArabic ? 'تعذر عرض المستند داخل Reader.' : 'Reader could not display this document.';
      message.textContent = `${heading}\n${String(error?.message ?? error)}`;
    }

    async function openDocument() {
      try {
        let module;
        let viewer;
        const options = { useGoogleFonts: false };
        if (format === 'docx') {
          module = await import('/renderer/docx.mjs');
          viewer = new module.DocxScrollViewer(container, { ...options, background: '#eceef2', gap: 14 });
        } else if (format === 'xlsx') {
          module = await import('/renderer/xlsx.mjs');
          viewer = new module.XlsxViewer(container, options);
        } else if (format === 'pptx') {
          module = await import('/renderer/pptx.mjs');
          viewer = new module.PptxScrollViewer(container, { ...options, background: '#eceef2', gap: 14 });
        } else {
          throw new Error('نوع الملف غير مدعوم في العارض المحلي.');
        }
        await viewer.load(documentUrl);
        message.hidden = true;
      } catch (error) {
        showError(error);
      }
    }

    openDocument();
  </script>
</body>
</html>
