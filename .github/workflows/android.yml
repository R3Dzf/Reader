name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Cache verified offline font assets
        uses: actions/cache@v4
        with:
          path: app/build/generated/readerFonts/assets
          key: reader-fonts-${{ hashFiles('tools/fonts-manifest.json', 'tools/prepare_fonts.py') }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run tests, lint, and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Cache verified offline font assets
        uses: actions/cache@v4
        with:
          path: app/build/generated/readerFonts/assets
          key: reader-fonts-${{ hashFiles('tools/fonts-manifest.json', 'tools/prepare_fonts.py') }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 35 rendering and gesture tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew connectedDebugAndroidTest
            mkdir -p app/build/reports/reader-visuals
            adb exec-out run-as com.r3dzf.reader cat files/powerpoint-reference.png > app/build/reports/reader-visuals/powerpoint-reference.png
            adb exec-out run-as com.r3dzf.reader cat files/fonts-reference.png > app/build/reports/reader-visuals/fonts-reference.png
      - name: Upload Android device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-device-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/reports/reader-visuals/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
